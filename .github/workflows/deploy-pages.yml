name: Deploy CalcMentor to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify math and problem bank
        run: node tests/smoke.test.cjs
      - name: Independently verify calculus answers
        run: node tests/independent-calculus.test.cjs
      - name: Independently verify limits and continuity
        run: node tests/independent-limits.test.cjs
      - name: Independently verify integrals and geometric applications
        run: node tests/independent-integrals.test.cjs
      - name: Independently verify functions and domains
        run: node tests/independent-functions.test.cjs
      - name: Independently verify derivative applications
        run: node tests/independent-applications.test.cjs
      - name: Independently verify FTC families
        run: node tests/independent-ftc.test.cjs
      - name: Validate worked solutions across generated problem variations
        run: node tests/worked-solutions.test.cjs
      - name: Verify complete worked solutions in every Calculus I family
        run: node tests/full-solution-coverage.test.cjs
      - name: Test homepage and sequential problem navigation
        run: node tests/navigation.test.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
